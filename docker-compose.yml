services:
  # 日常同步服务：极空间只需要启动这个服务。
  # 容器启动后立即同步一次，之后按照 GARMIN_SYNC_INTERVAL_HOURS 自动循环。
  daily-sync:
    # 镜像由 GitHub Actions 根据 main 分支自动构建并发布到 GHCR。
    # 极空间 Compose 页面只需要拉取这个镜像，不需要源码或 Dockerfile。
    image: ghcr.io/sanbaku/dailysync-rev:latest
    # 账号密码等敏感配置从项目目录下的 .env 读取，不要写进 compose 文件。
    env_file:
      - .env
    # 左侧是极空间项目目录中的文件夹，右侧是容器内路径。
    # db/garmin.db 保存登录会话和同步游标，必须持久化。
    # log 保存失败记录和运行日志。
    volumes:
      - ./db:/app/db
      - ./log:/app/log
    container_name: daily-sync
    # 极空间或 Docker 重启后自动恢复。
    restart: unless-stopped
    tty: true
    # 常驻同步模式：启动后立即执行一次，之后每隔指定时间同步一次。
    # 间隔由 .env 中的 GARMIN_SYNC_INTERVAL_HOURS 控制，支持 1 或 0.5。
    command: yarn daemon
    logging:
      driver: "json-file"
      options:
        # 防止 Docker 日志无限增长。
        max-size: "10m"
